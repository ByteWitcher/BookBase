
paths:
	/leaderboard:
		get:
			summary: Get leaderboard of users by total pages read
			description: Returns the top users ranked by total pages read across all sessions.
			parameters:
				- in: query
					name: limit
					schema:
						type: integer
						default: 10
					description: Number of top users to return
			responses:
				'200':
					description: Leaderboard data
					content:
						application/json:
							schema:
								type: array
								items:
									type: object
									properties:
										userId:
											type: string
										totalPages:
											type: integer
				'400':
					description: Bad request
					content:
						application/json:
							schema:
								type: object
								properties:
									error:
										type: string

