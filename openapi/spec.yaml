openapi: 3.0.3
info:
  title: BookBase API
  description: >
    Comprehensive documentation for the BookBase API.
    
    This API powers a community-driven digital library: managing books, users,
    reading sessions, gamification, and social interactions.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Server

tags:
  - name: Auth
    description: Authentication (Register, Login)
  - name: Users
    description: User Management
  - name: Books
    description: Main catalog management
  - name: Book Types
    description: Classification by form (Novel, Essay, etc.)
  - name: Book Genres
    description: Classification by genre (Sci-Fi, Fantasy, etc.)
  - name: Book Requests
    description: User-submitted book propositions
  - name: Interactions
    description: Reviews, Likes, Favorites
  - name: Reading
    description: Sessions, Progress, Achievements, Summaries

paths:
  # ============================================================
  # AUTHENTICATION
  # ============================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Validation error

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: Token returned successfully. User object includes password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, oldPassword, newPassword]
              properties:
                email: { type: string }
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        200:
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
                    example: "Password changed successfully"

  # ============================================================
  # USERS
  # ============================================================
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Retrieves the profile of the connected user, including sensitive data like password hash.
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithSecrets' # <--- Returns password

  /users/me/update:
    put:
      tags: [Users]
      summary: Update my profile
      description: Update personal information, including password.
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string, minLength: 6 } # <--- Added for updates
                role: 
                  type: string
                  enum: [USER, ADMIN]
      responses:
        200:
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithSecrets'

  /users/me/delete:
    delete:
      tags: [Users]
      summary: Delete my account
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account deleted successfully"

  /users:
    get:
      tags: [Users]
      summary: List all users (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of users (Passwords excluded)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/id/{id}:
    get:
      tags: [Users]
      summary: Get user by ID (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/email/{email}:
    get:
      tags: [Users]
      summary: Get user by Email (Admin)
      parameters:
        - { name: email, in: path, required: true, schema: { type: string } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/username/{username}:
    get:
      tags: [Users]
      summary: Get user by Username (Admin)
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/username/{username}/update:
    put:
      tags: [Users]
      summary: Update a user (Admin)
      description: Allows updating username, email, or promoting a user to ADMIN.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                role: 
                  type: string
                  enum: [USER, ADMIN]
                  description: Update the role (e.g., promote to ADMIN).
      responses:
        200:
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/username/{username}/delete:
    delete:
      tags: [Users]
      summary: Delete a user (Admin)
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "User deleted successfully" }
  # ============================================================
  # BOOKS
  # ============================================================
  /books:
    get:
      tags:
        - Books
      summary: Get a list of filtered and paginated books.
      operationId: getBooksFiltered
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
          description: Number of items per page.
        - in: query
          name: title
          schema:
            type: string
          description: Filter by book title (partial, case-insensitive match).
        - in: query
          name: authors
          schema:
            type: array
            items:
              type: string
          description: Filter by authors (overlap with book's authors array).
        - in: query
          name: edition
          schema:
            type: string
          description: Filter by edition (partial, case-insensitive match).
        - in: query
          name: languageCode
          schema:
            type: string
            pattern: "^[a-z]{2}$"
          description: Filter by 2-letter language code.
        - in: query
          name: bookTypeId
          schema:
            type: string
            format: uuid
          description: Filter by Book Type ID.
        - in: query
          name: bookGenreIds
          schema:
            type: array
            items:
              type: string
              format: uuid
          description: Filter by Book Genre IDs (requires all specified genres to be present).
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter books released on or after this date.
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter books released on or before this date.
        - in: query
          name: minPages
          schema:
            type: integer
            format: int32
          description: Filter for minimum page count.
        - in: query
          name: maxPages
          schema:
            type: integer
            format: int32
          description: Filter for maximum page count.
        - in: query
          name: minLikes
          schema:
            type: integer
            format: int32
          description: Filter for minimum likes count.
        - in: query
          name: maxLikes
          schema:
            type: integer
            format: int32
          description: Filter for maximum likes count.
        - in: query
          name: minRating
          schema:
            type: number
            format: float
          description: Filter for minimum rating.
        - in: query
          name: maxRating
          schema:
            type: number
            format: float
          description: Filter for maximum rating.
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [title, releaseDate, pageCount, likes, rating, createdAt]
            default: createdAt
          description: Field to sort by.
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort order.
      responses:
        200:
          description: Paginated list of books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        500:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Books
      summary: Create a new book. Requires multipart/form-data with a PDF file.
      operationId: createBook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pdfFile:
                  type: string
                  format: binary
                  description: The PDF file of the book.
                title:
                  type: string
                authors:
                  type: array
                  items:
                    type: string
                edition:
                  type: string
                description:
                  type: string
                languageCode:
                  type: string
                  pattern: "^[a-z]{2}$"
                releaseDate:
                  type: string
                  format: date
                pageCount:
                  type: integer
                  format: int32
                bookTypeId:
                  type: string
                  format: uuid
                bookGenreIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
                - title
                - authors
                - edition
                - description
                - languageCode
                - releaseDate
                - pageCount
                - bookTypeId
                - bookGenreIds
                - pdfFile
      responses:
        201:
          description: Book created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        400:
          $ref: '#/components/responses/BadRequestError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /books/{id}:
    get:
      tags:
        - Books
      summary: Get a book by ID.
      operationId: getBookById
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book ID.
      responses:
        200:
          description: Book details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags:
        - Books
      summary: Update an existing book by ID.
      operationId: updateBook
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        200:
          description: Book updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        400:
          $ref: '#/components/responses/BadRequestError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - Books
      summary: Delete a book by ID.
      operationId: deleteBookById
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book ID.
      responses:
        200:
          description: Book deleted successfully.
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  # ============================================================
  # BOOK TYPES
  # ============================================================
  /book-types:
    get:
      tags:
        - Book Types
      summary: Get all book types.
      operationId: getBookTypes
      responses:
        200:
          description: List of book types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookType'
        500:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Book Types
      summary: Create a new book type.
      operationId: createBookType
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookTypeCreateUpdate'
      responses:
        201:
          description: Book type created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookType'
        400:
          $ref: '#/components/responses/BadRequestError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-types/id/{id}:
    get:
      tags:
        - Book Types
      summary: Get a book type by ID.
      operationId: getBookTypeById
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book type ID.
      responses:
        200:
          description: Book type details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookType'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-types/code/{code}:
    get:
      tags:
        - Book Types
      summary: Get a book type by unique code.
      operationId: getBookTypeByCode
      parameters:
        - in: path
          name: code
          schema:
            type: string
          required: true
          description: The unique code of the book type.
      responses:
        200:
          description: Book type details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookType'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-types/name/{name}:
    get:
      tags:
        - Book Types
      summary: Get a book type by unique name.
      operationId: getBookTypeByName
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: The unique name of the book type.
      responses:
        200:
          description: Book type details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookType'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-types/{id}:
    put:
      tags:
        - Book Types
      summary: Update a book type by ID.
      operationId: updateBookType
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book type ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookTypeCreateUpdate'
      responses:
        200:
          description: Book type updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookType'
        400:
          $ref: '#/components/responses/BadRequestError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - Book Types
      summary: Delete a book type by ID.
      operationId: deleteBookTypeById
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book type ID.
      responses:
        200:
          description: Book type deleted successfully.
        400:
          description: Bad Request (Cannot delete with associated books).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  # ============================================================
  # BOOK GENRES
  # ============================================================
  /book-genres:
    get:
      tags:
        - Book Genres
      summary: Get all book genres.
      operationId: getBookGenres
      responses:
        200:
          description: List of book genres.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookGenre'
        500:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Book Genres
      summary: Create a new book genre.
      operationId: createBookGenre
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookGenreCreateUpdate'
      responses:
        201:
          description: Book genre created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGenre'
        400:
          $ref: '#/components/responses/BadRequestError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-genres/id/{id}:
    get:
      tags:
        - Book Genres
      summary: Get a book genre by ID.
      operationId: getBookGenreById
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book genre ID.
      responses:
        200:
          description: Book genre details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGenre'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-genres/code/{code}:
    get:
      tags:
        - Book Genres
      summary: Get a book genre by unique code.
      operationId: getBookGenreByCode
      parameters:
        - in: path
          name: code
          schema:
            type: string
          required: true
          description: The unique code of the book genre.
      responses:
        200:
          description: Book genre details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGenre'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-genres/name/{name}:
    get:
      tags:
        - Book Genres
      summary: Get a book genre by unique name.
      operationId: getBookGenreByName
      parameters:
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: The unique name of the book genre.
      responses:
        200:
          description: Book genre details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGenre'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-genres/{id}:
    put:
      tags:
        - Book Genres
      summary: Update a book genre by ID.
      operationId: updateBookGenre
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book genre ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookGenreCreateUpdate'
      responses:
        200:
          description: Book genre updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookGenre'
        400:
          $ref: '#/components/responses/BadRequestError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - Book Genres
      summary: Delete a book genre by ID.
      operationId: deleteBookGenreById
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book genre ID.
      responses:
        200:
          description: Book genre deleted successfully.
        400:
          description: Bad Request (Cannot delete with associated books).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  # ============================================================
  # BOOK REQUESTS
  # ============================================================
  /book-requests:
    get:
      tags:
        - Book Requests
      summary: Get a list of filtered and paginated book requests.
      operationId: getBookRequestsFiltered
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
          description: Number of items per page.
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
          description: Filter by request status.
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
          description: Filter by the ID of the user who made the request (Admin only).
        - in: query
          name: adminId
          schema:
            type: string
            format: uuid
          description: Filter by the ID of the admin who processed the request (Admin only).
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [status, createdAt]
            default: createdAt
          description: Field to sort by.
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort order.
      responses:
        200:
          description: Paginated list of book requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRequestListResponse'
        403:
          $ref: '#/components/responses/ForbiddenError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - Book Requests
      summary: Create a new book request (submitting a new book for review). Requires multipart/form-data with a PDF file.
      operationId: createBookRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pdfFile:
                  type: string
                  format: binary
                  description: The PDF file of the book.
                title:
                  type: string
                authors:
                  type: array
                  items:
                    type: string
                edition:
                  type: string
                description:
                  type: string
                languageCode:
                  type: string
                  pattern: "^[a-z]{2}$"
                releaseDate:
                  type: string
                  format: date
                pageCount:
                  type: integer
                  format: int32
                bookTypeId:
                  type: string
                  format: uuid
                bookGenreIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
                - title
                - authors
                - edition
                - description
                - languageCode
                - releaseDate
                - pageCount
                - bookTypeId
                - bookGenreIds
                - pdfFile
      responses:
        201:
          description: Book request created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRequest'
        400:
          $ref: '#/components/responses/BadRequestError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  /book-requests/{id}:
    get:
      tags:
        - Book Requests
      summary: Get a book request by ID.
      operationId: getBookRequestById
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book request ID.
      responses:
        200:
          description: Book request details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRequest'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags:
        - Book Requests
      summary: Update a book request (Admin uses this to approve/reject).
      operationId: updateBookRequest
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book request ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                  description: The new status for the request (only valid if status is PENDING).
                comment:
                  type: string
                  nullable: true
                  description: An optional comment, typically used for rejection.
      responses:
        200:
          description: Book request updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRequest'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - Book Requests
      summary: Delete a book request by ID. Only possible if the associated book has been deleted.
      operationId: deleteBookRequestById
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: The book request ID.
      responses:
        200:
          description: Book request deleted successfully.
        400:
          description: Bad Request (Book still exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          $ref: '#/components/responses/NotFoundError'
        500:
          $ref: '#/components/responses/ErrorResponse'

  # ============================================================
  # INTERACTIONS (Reviews, Likes, Favorites)
  # ============================================================
  /books/{id}/favorite:
    post:
      tags: [Interactions]
      summary: Add to favorites
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        201:
          description: Added to favorites successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Book added to favorites" }
                  data:
                    type: object
                    properties:
                      bookId: { type: string, format: uuid }

    delete:
      tags: [Interactions]
      summary: Remove from favorites
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Removed from favorites successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Book removed from favorites" }
                  data:
                    type: object
                    properties:
                      bookId: { type: string, format: uuid }

  /favorites/me:
    get:
      tags: [Interactions]
      summary: Get my favorite books
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        200:
          description: List of favorite books
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }

  /books/{id}/like:
    post:
      tags: [Interactions]
      summary: Toggle Like
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Book liked / unliked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Book unliked" }
                  data:
                    type: object
                    properties:
                      bookId: { type: string, format: uuid }
                      liked: { type: boolean }
                      action: { type: string, enum: ["LIKED", "UNLIKED"] }
                      totalLikes: { type: integer }

  /books/{id}/likes:
    get:
      tags: [Interactions]
      summary: Get users who liked a book
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of users who liked the book
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            username: { type: string }
                      total: { type: integer }

  /books/{id}/reviews:
    get:
      tags: [Interactions]
      summary: Get reviews for a book
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of reviews for the book
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  averageRating: { type: number, format: float }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Review'
                        - type: object
                          properties:
                            user:
                              type: object
                              properties:
                                id: { type: string }
                                username: { type: string }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }

    post:
      tags: [Interactions]
      summary: Post a review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: number }
                comment: { type: string }
      responses:
        201:
          description: Review created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Review created successfully" }
                  data:
                    $ref: '#/components/schemas/Review'

  /reviews/{reviewId}:
    put:
      tags: [Interactions]
      summary: Update a review
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: number }
                comment: { type: string }
      responses:
        200:
          description: Review updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Review updated successfully" }
                  data:
                    $ref: '#/components/schemas/Review'
        403:
          description: Forbidden (Not authorized)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  error: { type: string, example: "You are not authorized to update this review" }

    delete:
      tags: [Interactions]
      summary: Delete a review
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Review deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Review deleted successfully" }
                  data:
                    type: object
                    properties:
                      reviewId: { type: string, format: uuid }

  /reviews/me:
    get:
      tags: [Interactions]
      summary: Get my reviews
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        200:
          description: List of my reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Review'
                        - type: object
                          properties:
                            book:
                              $ref: '#/components/schemas/Book'
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }

  # ============================================================
  # READING SESSIONS
  # ============================================================
  /reading-sessions:
    post:
      tags: [Reading]
      summary: Create a reading session
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [bookId, startTime, endTime, startPage, endPage]
              properties:
                bookId: { type: string, format: uuid }
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                startPage: { type: integer }
                endPage: { type: integer }
      responses:
        201:
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSession'

  /reading-sessions/{id}:
    get:
      tags: [Reading]
      summary: Get session details
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Session details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSession'
    put:
      tags: [Reading]
      summary: Update session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Session updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingSession'
    delete:
      tags: [Reading]
      summary: Delete session
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Session deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /reading-sessions/me:
    get:
      tags: [Reading]
      summary: My sessions
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of my sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingSession'

  /reading-sessions/me/progress:
    get:
      tags: [Reading]
      summary: Get my book progress
      description: Returns a list of books the authenticated user has read, with the farthest page reached for each book.
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of user book progress
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bookId:
                      type: string
                      format: uuid
                    title:
                      type: string
                    farthestPage:
                      type: integer
                      description: Farthest page reached in the book

  /reading-sessions/leaderboard:
    get:
      tags: [Reading]
      summary: Reading leaderboard
      responses:
        200:
          description: Leaderboard data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    position: { type: integer }
                    userId: { type: string, format: uuid }
                    username: { type: string }
                    totalPages: { type: integer }

  # ============================================================
  # READING ACHIEVEMENTS
  # ============================================================
  /reading-achievements:
    get:
      tags: [Reading]
      summary: List all achievements (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of available achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingAchievement'

  /reading-achievements/me:
    get:
      tags: [Reading]
      summary: My unlocked achievements
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of my achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingAchievement'

  # ============================================================
  # WEEKLY SUMMARIES
  # ============================================================
  /weekly-summaries/me:
    get:
      tags: [Reading]
      summary: My weekly summaries
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: List of summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklySummary'

  /weekly-summaries/me/current-week:
    get:
      tags: [Reading]
      summary: My summary for current week
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Summary details for current week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklySummary'

  /weekly-summaries/generate-current-week:
    post:
      tags: [Reading]
      summary: Generate summaries for ALL users (Admin)
      security: [{ BearerAuth: [] }]
      responses:
        200:
          description: Generation process triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: A detailed error message.
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [USER, ADMIN] }
        createdAt: { type: string, format: date-time }
    UserWithSecrets:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            password: { type: string }
    BookType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique code for the book type.
        name:
          type: string
          description: Unique name for the book type.
        description:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - description
    BookTypeCreateUpdate:
      type: object
      properties:
        code:
          type: string
          description: Unique code for the book type.
        name:
          type: string
          description: Unique name for the book type.
        description:
          type: string
      required:
        - code
        - name
        - description
    BookGenre:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique code for the book genre.
        name:
          type: string
          description: Unique name for the book genre.
        description:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - description
    BookGenreCreateUpdate:
      type: object
      properties:
        code:
          type: string
          description: Unique code for the book genre.
        name:
          type: string
          description: Unique name for the book genre.
        description:
          type: string
      required:
        - code
        - name
        - description
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: SHA256 hash of title+authors+edition+languageCode.
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        edition:
          type: string
        description:
          type: string
        languageCode:
          type: string
          pattern: "^[a-z]{2}$"
        releaseDate:
          type: string
          format: date-time
        pageCount:
          type: integer
          format: int32
        likes:
          type: integer
          format: int32
        rating:
          type: number
          format: float
        s3PdfUrl:
          type: string
          format: url
        isActive:
          type: boolean
        bookTypeId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          description: ID of the user who submitted the book.
        adminId:
          type: string
          format: uuid
          nullable: true
          description: ID of the admin who approved/processed the book.
        createdAt:
          type: string
          format: date-time
        bookType:
          $ref: '#/components/schemas/BookType'
        bookGenres:
          type: array
          items:
            $ref: '#/components/schemas/BookGenre'
      required:
        - id
        - fingerprint
        - title
        - authors
        - edition
        - description
        - languageCode
        - releaseDate
        - pageCount
        - likes
        - rating
        - s3PdfUrl
        - isActive
        - bookTypeId
        - userId
    BookUpdate:
      type: object
      properties:
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        edition:
          type: string
        description:
          type: string
        languageCode:
          type: string
          pattern: "^[a-z]{2}$"
        releaseDate:
          type: string
          format: date-time
        pageCount:
          type: integer
          format: int32
        s3PdfUrl:
          type: string
          format: url
        bookTypeId:
          type: string
          format: uuid
        bookGenreIds:
          type: array
          items:
            type: string
            format: uuid
    BookListResponse:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        pageSize:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    BookRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        comment:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          description: Populated if the original book was deleted.
        authors:
          type: array
          items:
            type: string
          nullable: true
          description: Populated if the original book was deleted.
        edition:
          type: string
          nullable: true
          description: Populated if the original book was deleted.
        languageCode:
          type: string
          nullable: true
          description: Populated if the original book was deleted.
        bookId:
          type: string
          format: uuid
          nullable: true
        userId:
          type: string
          format: uuid
        adminId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        book:
          $ref: '#/components/schemas/Book'
      required:
        - id
        - status
        - userId
        - createdAt
    BookRequestListResponse:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        pageSize:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookRequest'
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        rating: { type: number }
        comment: { type: string }
        userId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReadingSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        pagesRead: { type: integer }
    ReadingAchievement:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        label: { type: string }
        unlockedAt: { type: string, format: date-time }
    WeeklySummary:
      type: object
      properties:
        userId: { type: string, format: uuid }
        weekStart: { type: string, format: date }
        weekEnd: { type: string, format: date }
        totalReadingMinutes: { type: integer }
        totalPagesRead: { type: integer }
  responses:
    ErrorResponse:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequestError:
      description: Bad Request / Validation Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Forbidden (Insufficient permissions or trying to access another user's request)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'