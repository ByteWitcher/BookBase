stages:
  - formatting
  - unit tests
  - coverage
  - sonarqube
  - deploy

format-check:
  stage: formatting
  image: node:18
  script:
    - npm ci
    - echo "Running Prettier format checks..."
    - npx prettier "src/**/*" "test/**/*" --check
  only:
    - merge_requests

unit-tests:
  stage: unit tests
  image: node:18
  script:
    - npm ci
    - echo "Running unit tests..."
    - npm test
  only:
    - merge_requests

coverage-report:
  stage: coverage
  image: node:18
  script:
    - npm ci
    - echo "Generating coverage report..."
    - npm run coverage
  artifacts:
    when: always
    paths:
      - coverage/
  only:
    - merge_requests

sonarqube-check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
  dependencies:
    - coverage-report

deploy-npm:
  stage: deploy
  image: node:18
  variables:
    NODE_ENV: production
  script:
    - echo "JWT_SECRET=$JWT_SECRET" > .env
    - echo "DATABASE_URL=$DATABASE_URL" >> .env
    - echo "AWS_ACCESS_KEY=$AWS_ACCESS_KEY" >> .env
    - echo "AWS_SECRET_KEY=$AWS_SECRET_KEY" >> .env
    - echo "AWS_REGION=$AWS_REGION" >> .env
    - echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .env
    - echo "NPM_TOKEN=$NPM_TOKEN" >> .env

    - BASE_VERSION=$(node -p "require('./package.json').version")
    - UNIQUE_VERSION="${BASE_VERSION}-${CI_PIPELINE_IID}"
    - echo "Bumping package version to $UNIQUE_VERSION"
    - npm version $UNIQUE_VERSION --no-git-tag-version

    - npm ci
    - npm publish
  only:
    - pushes

deploy-docker:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - |
      echo "JWT_SECRET=$JWT_SECRET" > .env
      echo "DATABASE_URL=$DATABASE_URL" >> .env
      echo "AWS_ACCESS_KEY=$AWS_ACCESS_KEY" >> .env
      echo "AWS_SECRET_KEY=$AWS_SECRET_KEY" >> .env
      echo "AWS_REGION=$AWS_REGION" >> .env
      echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .env
      echo "NPM_TOKEN=$NPM_TOKEN" >> .env
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - pushes
