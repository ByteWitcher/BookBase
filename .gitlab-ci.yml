stages:
  - formatting
  - unit tests
  - integration tests
  - coverage
  - sonarqube
  - deploy

format-check:
  stage: formatting
  image: node:18
  script:
    - npm ci
    - echo "Running Prettier format checks..."
    - npx prettier "src/**/*" "test/**/*" --check
  only:
    - merge_requests

unit-tests:
  stage: unit tests
  image: node:18
  script:
    - npm ci
    - echo "Running unit tests..."
    - npm test
  only:
    - merge_requests


integration-tests:
  stage: integration tests
  image: node:18
  # services:
  #   - postgres:13
  variables:
    # Override the cloud DB URL with local PostgreSQL service for CI
    # DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/testdb"
    # POSTGRES_DB: testdb
    # POSTGRES_USER: postgres
    # POSTGRES_PASSWORD: postgres
    # NODE_ENV: test
  script:
    - npm ci
    - npm install -g newman
    - npm start &
    - |
      for i in {1..30}; do
        if curl -s http://localhost:3000/ > /dev/null; then
          echo "Server is up!"
          break
        fi
        echo "Waiting for server..."
        sleep 5
      done
    - newman run "postman/collection.json" --env-var "baseUrl=http://localhost:3000" --bail
  after_script:
    - pkill -f "node index.js" || true
  artifacts:
    when: always
    paths:
      - newman/
  only:
    - merge_requests
  dependencies:
    - unit-tests
  before_script:
    # Ensure Book.pdf is present in the correct path for file upload
    - cp "postman/Book.pdf" Book.pdf

coverage-report:
  stage: coverage
  image: node:18
  script:
    - npm ci
    - echo "Generating coverage report..."
    - npm run coverage
  artifacts:
    when: always
    paths:
      - coverage/
  only:
    - merge_requests

sonarqube-check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
  dependencies: 
    - coverage-report

deploy-npm:
  stage: deploy
  image: node:18
  variables:
    NODE_ENV: production
  script:
    - BASE_VERSION=$(node -p "require('./package.json').version")
    - UNIQUE_VERSION="${BASE_VERSION}-${CI_PIPELINE_IID}"
    - echo "Bumping package version to $UNIQUE_VERSION"
    - npm version $UNIQUE_VERSION --no-git-tag-version
    - npm ci
    - npm publish --tag latest
  only:
    - pushes

deploy-docker:
  stage: deploy
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
    - docker build -t "$DOCKER_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHA"
    - docker tag "$DOCKER_IMAGE:$CI_COMMIT_SHA" "$DOCKER_IMAGE:latest"
    - docker push "$DOCKER_IMAGE:latest"
  only:
    - pushes
