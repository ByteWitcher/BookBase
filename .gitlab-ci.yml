stages:
  - formatting
  - unit tests
  - coverage
  - sonarqube

format-check:
  stage: formatting
  image: node:18
  script:
    - npm ci
    - echo "Running Prettier format checks..."
    - npx prettier "src/**/*" "test/**/*" --write
  only:
    - merge_requests

unit-tests:
  stage: unit tests
  image: node:18
  script:
    - npm ci
    - echo "Running unit tests..."
    - npm test
  artifacts:
    when: always
    paths:
      - coverage/
  only:
    - merge_requests

coverage-report:
  stage: coverage
  image: node:18
  script:
    - npm ci
    - echo "Generating coverage report..."
    - npm run coverage
  artifacts:
    when: always
    paths:
      - coverage/
  only:
    - merge_requests

sonarqube-check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
  dependencies:
    - coverage-report
