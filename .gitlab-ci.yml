stages:
  - formatting
  - unit tests
  - integration tests
  - coverage
  - sonarqube

format-check:
  stage: formatting
  image: node:18
  script:
    - npm ci
    - echo "Running Prettier format checks..."
    - npx prettier "src/**/*" "test/**/*" --check
  only:
    - merge_requests

unit-tests:
  stage: unit tests
  image: node:18
  script:
    - npm ci
    - echo "Running unit tests..."
    - npm test
  only:
    - merge_requests


integration-tests:
  stage: integration tests
  image: postman/newman:alpine
  script:
    - echo "Running Postman integration tests with Newman..."
    - newman run postman/collection.json --env-var "baseUrl=http://localhost:3000" --insecure --timeout-request 60000 --bail --verbose --folder "05. Books" --folder "06. Book Requests" --folder "08. Reading Sessions & Progress" --folder "09. Weekly Summaries & Achievements"
  artifacts:
    when: always
    paths:
      - newman/
  only:
    - merge_requests
  dependencies:
    - unit-tests
  before_script:
    - apk add --no-cache curl
    # Ensure Book.pdf is present in the correct path for file upload
    - cp postman/Book.pdf Book.pdf

coverage-report:
  stage: coverage
  image: node:18
  script:
    - npm ci
    - echo "Generating coverage report..."
    - npm run coverage
  artifacts:
    when: always
    paths:
      - coverage/
  only:
    - merge_requests

sonarqube-check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # Defines the location of the analysis task cache
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
  dependencies: 
    - coverage-report
